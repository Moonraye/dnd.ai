name: CI

on:
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build @dnd/shared
        run: npm run build -w packages/shared

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build server
        run: npm run build -w server

      - name: Build client
        run: npm run build -w client
